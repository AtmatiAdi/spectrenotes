[package]
name = "spectrenotes-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "SpectreNotes-Setup"
path = "src/main.rs"

[dependencies]
spectre-shell-win = { path = "../../crates/spectre-shell-win" }
spectre-update = { path = "../../crates/spectre-update" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"
