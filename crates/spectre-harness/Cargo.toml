[package]
name = "spectre-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Uprzaz testowa: odtwarzanie piora bez okna, render WARP do PNG, licznik klatek, opoznienie."

[dependencies]
spectre-core = { path = "../spectre-core" }
spectre-ink = { path = "../spectre-ink" }
spectre-proto = { path = "../spectre-proto" }
spectre-render = { path = "../spectre-render" }

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation"]

[[bin]]
name = "spectre-harness"
path = "src/bin/harness.rs"
