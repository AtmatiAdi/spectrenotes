[package]
name = "spectre-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "spectrenotes"
path = "src/main.rs"

[dependencies]
spectre-core = { path = "../spectre-core" }
spectre-ink = { path = "../spectre-ink" }
spectre-proto = { path = "../spectre-proto" }
spectre-render = { path = "../spectre-render" }
spectre-shell-win = { path = "../spectre-shell-win" }
spectre-sync = { path = "../spectre-sync" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
