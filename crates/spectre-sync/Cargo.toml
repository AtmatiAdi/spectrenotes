[package]
name = "spectre-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
spectre-core = { path = "../spectre-core" }
spectre-proto = { path = "../spectre-proto" }
# libgit2 statycznie w binarce (ADR 0006): bez zaleznosci od gita na maszynie.
# `https` na Windows = WinHTTP (systemowe TLS, proxy, bez OpenSSL).
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2"] }
# Multicast do wykrywania peerow w LAN: dwie instancje na jednej maszynie musza
# dzielic port (SO_REUSEADDR), a std tego nie wystawia. Malutki, bez zaleznosci.
socket2 = "0.6"
# Haslo udostepnionej notatki: klucz pochodny i dowod challenge-response (ADR 0008).
sha2 = "0.10"

# Lista interfejsow IPv4 (GetAdaptersAddresses): beacon idzie przez kazdy, nie
# tylko przez ten z trasa domyslna - przy wlaczonym VPN to tunel, nie Wi-Fi.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
]
