[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AtmatiAdi/spectrenotes"

[profile.dev]
# Rysowanie musi byc plynne nawet w buildzie debug - inaczej ocena odczucia piora
# jest bezwartosciowa, bo mierzymy narzut braku optymalizacji zamiast latencji.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
